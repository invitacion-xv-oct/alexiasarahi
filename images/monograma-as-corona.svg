<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 920" role="img" aria-labelledby="title desc">
  <title id="title">Monograma AS con corona</title>
  <desc id="desc">Monograma plateado y azul hielo con las iniciales AS y una corona de quinceañera.</desc>
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.2" stop-color="#aebbd0"/>
      <stop offset="0.45" stop-color="#f8fbff"/>
      <stop offset="0.7" stop-color="#7586a3"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf8ff"/>
      <stop offset="0.5" stop-color="#79c9ff"/>
      <stop offset="1" stop-color="#1c5fc2"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#041a45" flood-opacity=".55"/>
    </filter>
  </defs>

  <g id="sparkle" fill="#fff" filter="url(#glow)">
    <path d="M400 18l9 31 31 9-31 9-9 31-9-31-31-9 31-9z"/>
    <circle cx="400" cy="58" r="4" fill="#aee7ff"/>
  </g>

  <g id="crown" fill="none" stroke="url(#silver)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <path d="M170 304Q400 250 630 304"/>
    <path d="M190 289l26-120 86 83 98-151 98 151 86-83 26 120"/>
    <path d="M216 169q38-44 75 4M302 252q46-56 92 0M406 252q46-56 92 0M509 173q38-48 75-4"/>
    <circle cx="216" cy="169" r="15" fill="url(#ice)"/>
    <circle cx="400" cy="101" r="19" fill="url(#ice)"/>
    <circle cx="584" cy="169" r="15" fill="url(#ice)"/>
    <path d="M400 118l35 52-35 48-35-48z" fill="url(#ice)"/>
    <path d="M172 306q228 55 456 0"/>
  </g>

  <g id="monogram" filter="url(#shadow)" text-anchor="middle">
    <text x="330" y="750" font-family="Georgia, 'Times New Roman', serif" font-size="560" font-weight="400" fill="url(#silver)" stroke="#ffffff" stroke-opacity=".22" stroke-width="2">A</text>
    <text x="487" y="806" font-family="Georgia, 'Times New Roman', serif" font-size="520" font-weight="400" fill="url(#silver)" stroke="#ffffff" stroke-opacity=".22" stroke-width="2">S</text>
    <path d="M365 362L445 710" stroke="url(#ice)" stroke-width="24" stroke-linecap="round" opacity=".9"/>
  </g>
</svg>
